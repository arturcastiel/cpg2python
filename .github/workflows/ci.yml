name: CI

on:
  push:
    branches: [main, release-candidate]
  pull_request:
    branches: [main, release-candidate]

# Opt all JavaScript actions into the Node 24 runtime ahead of the
# 2026-06 forced migration — silences the Node-20 deprecation warning
# without depending on each action publishing a new major tag.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev/fast extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fast]"

      - name: Run test suite
        run: pytest -ra
