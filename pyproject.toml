[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpg2unstructured"
version = "0.2.0"
description = "Lightweight CPG (Eclipse corner-point) to unstructured-mesh + graph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Dr. Artur Castiel Reis de Souza"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
fast = ["scipy>=1.10"]
dev  = ["pytest>=7", "pytest-cov>=4", "build"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cpg2unstructured*"]

[tool.setuptools.package-data]
cpg2unstructured = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
